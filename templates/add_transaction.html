{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">

    <div class="card p-4 shadow" style="width:420px; border-radius:12px;">

        <h3 class="text-center mb-4">Add Transaction</h3>

        {% if anomaly %}
        <div class="alert alert-danger text-center">
        ⚠️ Unusual Spending Detected!
        </div>
        {% endif %}
        
        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Amount</label>
                <input type="number" step="0.01" class="form-control" name="amount" placeholder="Enter amount" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <input type="text" class="form-control" name="description" placeholder="e.g. Grocery, Uber ride" required>
            </div>

            <button class="btn btn-primary w-100 mt-2">
                <i class="fa fa-plus"></i> Add Transaction
            </button>

        </form>

    </div>

</div>

{% endblock %}
