<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#5f5ce6,#6d5dfc);
}

.login-card{
    width:420px;
    padding:40px;
    background:white;
    border-radius:16px;
    box-shadow:0 15px 35px rgba(0,0,0,0.15);
}

.login-title{
    font-weight:600;
}

</style>

</head>

<body>

<div class="login-card">

<h2 class="text-center mb-4 login-title">Login</h2>

<form method="POST">

<div class="mb-3">
<input class="form-control form-control-lg"
       type="email"
       name="email"
       placeholder="Email"
       required>
</div>

<div class="mb-3">
<input class="form-control form-control-lg"
       type="password"
       name="password"
       placeholder="Password"
       required>
</div>

<button class="btn btn-primary w-100 btn-lg">
Login
</button>

</form>

<p class="text-center mt-3">

<a href="{{ url_for('auth.register') }}">Create account</a>

</p>

</div>

</body>

</html>
