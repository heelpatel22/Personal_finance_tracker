<!DOCTYPE html>
<html>

<head>

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1da1f2,#3b82f6);
font-family:Arial;
}

.register-card{
width:420px;
padding:40px;
background:white;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

</style>

</head>

<body>

<div class="register-card">

<h3 class="text-center mb-1">💰 Finance AI</h3>
<p class="text-center text-muted mb-4">Smart Expense Tracker</p>

<h2 class="text-center mb-4">Create Account</h2>

<form method="POST">

<input
class="form-control mb-3"
type="text"
name="username"
placeholder="Username"
required>

<input
class="form-control mb-3"
type="email"
name="email"
placeholder="Email"
required>

<input
class="form-control mb-3"
type="password"
name="password"
placeholder="Password"
required>

<button class="btn btn-success w-100">
Register
</button>

</form>

<p class="text-center mt-3">

<a href="{{ url_for('auth.login') }}">
Login instead
</a>

</p>

</div>

</body>

</html>
